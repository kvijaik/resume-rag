name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "1"   # fully offline: no OpenAI key or cost in CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Unit and integration tests
        run: pytest --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=100
      - name: RAG evaluation (quality gate)
        run: python -m eval.run_eval --min-status-accuracy 0.9 --min-hit-at-k 1.0 --json eval-report.json
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
